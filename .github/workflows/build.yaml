name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          #   args: '--target x86_64-apple-darwin'
          # - platform: 'ubuntu-22.04'
          #   args: ''
          # - platform: 'ubuntu-22.04-arm' # Only available in public repos.
          #   args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Enable Corepack
        run: corepack enable # This command enables Corepack, allowing package managers like Yarn and pnpm to be managed by Corepack

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc, aarch64-pc-windows-msvc' || matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # change this to npm or pnpm depending on which one you use.

      - name: Decode PFX Certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}/cert.pfx", $certBytes)

      - name: Update bundle.config.json for Signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $configPath = "src-tauri/gen/windows/bundle.config.json"
          $config = Get-Content $configPath | ConvertFrom-Json
          $config.identityName = "${{ secrets.WINDOWS_PACKAGE_IDENTITY_NAME }}"
          $config.publisher = "${{ secrets.WINDOWS_PACKAGE_IDENTITY_PUBLISHER }}"
          $config.publisherDisplayName = "${{ secrets.WINDOWS_PACKAGE_PROPERTIES_PUBLISHER_DISPLAY_NAME }}"
          $config.signing.pfx = "${{ github.workspace }}/cert.pfx"
          $config.signing.pfxPassword = "${{ secrets.WINDOWS_CERT_PASSWORD }}"
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Build MSIX bundle
        if: matrix.platform == 'windows-latest'
        run: pnpm tauri:windows:build "--arch" "x64,arm64" "--runner" "pnpm"

      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Clean up Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "${{ github.workspace }}/cert.pfx") {
            Remove-Item "${{ github.workspace }}/cert.pfx" -Force
          }

      - name: Upload artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: msix-bundle
          path: src-tauri/target/msix/*.msixbundle
