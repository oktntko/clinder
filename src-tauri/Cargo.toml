[package]
name = "clinder"
version = "0.9.2"
description = "Clinder is a lightweight, always-running clipboard history manager designed for fast, keyboard-only use."
authors = ["oktntko@gmail.com"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
nucleo-matcher = "0.3.1"
enigo = { version = "0.6.1", default-features = false }
tauri-plugin-store = "2"
font-kit = "0.14.3"
sha2 = "0.11.0"
hex = "0.4.3"
clipboard-rs = "0.3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Storage_Packaging_Appx",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
